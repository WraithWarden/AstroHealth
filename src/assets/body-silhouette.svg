<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 460" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#061828"/>
    </linearGradient>
    <linearGradient id="limbGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#081e38"/>
      <stop offset="100%" stop-color="#061828"/>
    </linearGradient>
    <filter id="bodyGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left upper arm -->
  <path d="M28,88 L14,86 L4,196 L18,198 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Left forearm -->
  <path d="M18,198 L4,196 L2,320 L14,318 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Left hand -->
  <ellipse cx="8" cy="323" rx="8" ry="11"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>

  <!-- Right upper arm -->
  <path d="M132,88 L146,86 L156,196 L142,198 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Right forearm -->
  <path d="M142,198 L156,196 L158,320 L146,318 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Right hand -->
  <ellipse cx="152" cy="323" rx="8" ry="11"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>

  <!-- Torso -->
  <path d="M28,80 Q22,120 36,200 L52,250 L108,250 L124,200 Q138,120 132,80 Q118,70 80,68 Q42,70 28,80 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.5)" stroke-width="1.4" filter="url(#bodyGlow)"/>

  <!-- Pelvis -->
  <path d="M52,250 Q46,275 44,290 L116,290 Q114,275 108,250 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>

  <!-- Left leg upper -->
  <path d="M44,290 L68,290 L62,390 L40,392 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Left leg lower -->
  <path d="M40,392 L62,390 L60,445 L38,446 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>
  <!-- Left foot -->
  <ellipse cx="47" cy="449" rx="16" ry="7"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>

  <!-- Right leg upper -->
  <path d="M116,290 L92,290 L98,390 L120,392 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>
  <!-- Right leg lower -->
  <path d="M120,392 L98,390 L100,445 L122,446 Z"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>
  <!-- Right foot -->
  <ellipse cx="113" cy="449" rx="16" ry="7"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.4)" stroke-width="1.2"/>

  <!-- Neck -->
  <rect x="68" y="62" width="24" height="20" rx="2"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.45)" stroke-width="1.2"/>

  <!-- Head -->
  <ellipse cx="80" cy="38" rx="30" ry="34"
        fill="url(#bodyGrad)" stroke="rgba(0,180,255,0.55)" stroke-width="1.5" filter="url(#bodyGlow)"/>

  <!-- Internal detail lines (ribcage hint) -->
  <line x1="66" y1="112" x2="94" y2="108" stroke="rgba(0,180,255,0.1)" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="64" y1="126" x2="96" y2="122" stroke="rgba(0,180,255,0.1)" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="63" y1="140" x2="97" y2="136" stroke="rgba(0,180,255,0.1)" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- spine -->
  <line x1="80" y1="78" x2="80" y2="250" stroke="rgba(0,180,255,0.08)" stroke-width="1" stroke-dasharray="2 4"/>
</svg>
